name: Check source
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: Packages and clean restore
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      RENV_PATHS_ROOT: /tmp/teal-renv-state
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out workflow code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned code style tooling
        run: python3 -m pip install -r requirements-dev.txt
      - name: Check Python formatting and imports
        run: |
          python3 -m ruff format --check .
          python3 -m ruff check .
      - name: Validate workflow syntax and expressions
        run: bash scripts/lint-workflows.sh
      - name: Read published package identities
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: armcn/teal-depository-demo
          ref: published
          path: .work/published
          persist-credentials: false
      - name: Install the pinned R version
        uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: renv
          use-public-rspm: false
      - name: Test release tooling
        run: python3 -m unittest discover -s tests -v
      - name: Restore pinned dependencies
        run: Rscript --vanilla scripts/restore-dependencies.R
      - name: Build and check all internal packages
        env:
          SNAPSHOT: ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: >-
          python3 scripts/release.py build --out dist/candidate --snapshot "$SNAPSHOT"
          --source-sha "$GITHUB_SHA" --existing-site .work/published/site
      - name: Restore from repository into an empty library and test apps
        run: python3 scripts/release.py verify dist/candidate
      - name: Retain diagnostic logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: check-diagnostics
          path: .work/logs
          if-no-files-found: ignore
          retention-days: 7
